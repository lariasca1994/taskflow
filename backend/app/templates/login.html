{% extends "base.html" %}
{% set centrar = true %}
{% block titulo %}Ingresar · TaskFlow{% endblock %}

{% block contenido %}
<div class="w-full max-w-sm">
    <div class="text-center mb-8">
        <span class="inline-flex w-12 h-12 rounded-xl bg-indigo-600 items-center justify-center text-white text-xl font-bold mb-4">T</span>
        <h1 class="text-2xl font-bold tracking-tight">Bienvenido de vuelta</h1>
        <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Ingresa para ver tus tareas</p>
    </div>

    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-8 shadow-sm">
        {% if error %}
        <div class="mb-5 px-4 py-3 rounded-lg bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300 text-sm border border-rose-100 dark:border-rose-900">{{ error }}</div>
        {% endif %}

        <form method="post" action="/ingresar" class="space-y-4">
            <div>
                <label for="email" class="etiqueta">Correo electrónico</label>
                <input type="email" id="email" name="email" required autofocus
                       value="{{ email or '' }}" class="campo">
            </div>
            <div>
                <label for="password" class="etiqueta">Contraseña</label>
                <input type="password" id="password" name="password" required class="campo">
            </div>
            <button type="submit" class="boton-primario w-full">Ingresar</button>
        </form>
    </div>

    <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
        ¿No tienes cuenta? <a href="/registro" class="text-indigo-600 dark:text-indigo-400 font-medium hover:underline">Crear una</a>
    </p>
</div>
{% endblock %}
